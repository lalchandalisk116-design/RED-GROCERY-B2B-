name: Build RED GROCERY B2B APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q RED_GROCERY_B2B_COMPLETE_PROJECT.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: RED-GROCERY-B2B-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk android.useAndroidX=true
android.enableJetifier=trueandroid.useAndroidX=true
